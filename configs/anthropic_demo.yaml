providers:
  anthropic:
    enabled: true
    model: ${ANTHROPIC_MODEL}
    api_key_env: ANTHROPIC_AUTH_TOKEN
    base_url: ${ANTHROPIC_BASE_URL}
    anthropic_version: "2023-06-01"
    concurrency: 1
    max_retries: 3
    temperature: 1.0
    max_output_tokens: 24

sampling:
  panel_id: study2_british_within
  answer_language: English
  prompt_languages: [en, zh]
  round1_samples: 1
  round2_samples: 1
  enable_round2: false
  round2_trigger: cross_lingual_top1_mismatch
  random_seed: 20260324

normalization:
  alias_path: ../data/aliases/default_aliases.csv
  allow_unmapped: false
  fuzzy_match_threshold: 95

analysis:
  bootstrap_resamples: 10
  item_bootstrap_resamples: 10

outputs:
  run_root: ../artifacts/runs
  cache_root: ../artifacts/cache
