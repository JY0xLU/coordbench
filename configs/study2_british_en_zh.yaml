providers:
  anthropic:
    enabled: false
    model: ${ANTHROPIC_MODEL}
    api_key_env: ANTHROPIC_AUTH_TOKEN
    concurrency: 3
    max_retries: 3
    temperature: 1.0
    max_output_tokens: 24
    timeout_seconds: 120
    base_url: ${ANTHROPIC_BASE_URL}
    anthropic_version: "2023-06-01"
    compat_mode: openai
  openai:
    enabled: true
    model: ${OPENAI_MODEL}
    api_key_env: OPENAI_API_KEY
    concurrency: 3
    max_retries: 5
    temperature: 1.0
    max_output_tokens: 24
  gemini:
    enabled: false
    model: ${GEMINI_MODEL}
    api_key_env: GEMINI_API_KEY
    concurrency: 3
    max_retries: 5
    temperature: 1.0
    max_output_tokens: 24
  deepseek:
    enabled: false
    model: ${DEEPSEEK_MODEL}
    api_key_env: DEEPSEEK_API_KEY
    concurrency: 3
    max_retries: 5
    temperature: 1.0
    max_output_tokens: 24

sampling:
  panel_id: study2_british_within
  answer_language: English
  prompt_languages: [en, zh]
  max_enabled_providers: 1
  round1_samples: 30
  round2_samples: 10
  enable_round2: true
  round2_trigger: cross_lingual_top1_mismatch
  random_seed: 20260324

normalization:
  alias_path: ../data/aliases/default_aliases.csv
  allow_unmapped: false
  fuzzy_match_threshold: 95

analysis:
  bootstrap_resamples: 1000
  item_bootstrap_resamples: 1000

outputs:
  run_root: ../artifacts/runs
  cache_root: ../artifacts/cache
