<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CoordBench dual-axis interpretation</title>
  <desc id="desc">A two-axis summary separating human alignment from cross-lingual stability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFCFF"/>
      <stop offset="1" stop-color="#F7FBF8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#203049" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#9AA9BA" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>

  <text x="640" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#182235">Two Diagnostics, Not One Leaderboard</text>
  <text x="640" y="105" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#53647A">CoordBench separates whether a model matches human focal points from whether it stays stable across prompt languages.</text>

  <g transform="translate(118 142)">
    <rect x="0" y="0" width="1044" height="396" rx="24" fill="white" filter="url(#soft)"/>
    <line x1="118" y1="314" x2="930" y2="314" stroke="#1F2A3A" stroke-width="3"/>
    <line x1="118" y1="314" x2="118" y2="58" stroke="#1F2A3A" stroke-width="3"/>
    <path d="M930 314L908 302V326L930 314Z" fill="#1F2A3A"/>
    <path d="M118 58L106 80H130L118 58Z" fill="#1F2A3A"/>
    <text x="524" y="364" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2A3A">Cross-lingual stability</text>
    <text x="524" y="390" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#65758B">EN prompt distribution matches ZH prompt distribution</text>
    <g transform="translate(42 210) rotate(-90)">
      <text text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2A3A">Human alignment</text>
    </g>

    <rect x="140" y="78" width="330" height="116" rx="18" fill="#FFF7EF" stroke="#F2B67C"/>
    <circle cx="177" cy="116" r="13" fill="#E6864A"/>
    <text x="202" y="107" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#7F421E">Human-like, less stable</text>
    <text x="202" y="137" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5A4E">Good human match can still flip focal answers when the prompt language changes.</text>

    <rect x="600" y="78" width="330" height="116" rx="18" fill="#F5F1FF" stroke="#B8A4E7"/>
    <circle cx="637" cy="116" r="13" fill="#6E57B5"/>
    <text x="662" y="107" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#3E2F77">Strong on both</text>
    <text x="662" y="137" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#5B536D">The ideal region: close to humans and stable across instruction languages.</text>

    <rect x="140" y="222" width="330" height="92" rx="18" fill="#F5F7FA" stroke="#C7D0DB"/>
    <circle cx="177" cy="260" r="13" fill="#C1CBD6"/>
    <text x="202" y="251" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#4B596B">Weak on both</text>
    <text x="202" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#667789">Far from humans and sensitive to prompt language.</text>

    <rect x="600" y="222" width="330" height="92" rx="18" fill="#EFFAF5" stroke="#8BC9A8"/>
    <circle cx="637" cy="260" r="13" fill="#4E9B84"/>
    <text x="662" y="251" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#236956">Stable, less human-like</text>
    <text x="662" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#536E65">Consistent defaults, but not necessarily the human focal distribution.</text>
  </g>

  <g transform="translate(214 568)">
    <circle cx="0" cy="0" r="7" fill="#6E57B5"/>
    <text x="18" y="6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#53647A">No evaluated model dominates both axes in the final report.</text>
    <circle cx="426" cy="0" r="7" fill="#4E9B84"/>
    <text x="444" y="6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#53647A">Model choice depends on the deployment role.</text>
    <circle cx="802" cy="0" r="7" fill="#E6864A"/>
    <text x="820" y="6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#53647A">A single score would hide the trade-off.</text>
  </g>
</svg>
