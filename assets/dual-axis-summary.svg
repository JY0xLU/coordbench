<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CoordBench result interpretation matrix</title>
  <desc id="desc">A clean two-axis matrix showing that human alignment and cross-lingual stability should be interpreted separately.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#F6FAF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#233044" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#8FA0B2" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="24" fill="url(#grid)"/>

  <text x="640" y="56" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033">Final Report Interpretation</text>
  <text x="640" y="88" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#5A6A80">CoordBench reports two independent diagnostics: human-likeness and language stability.</text>

  <g transform="translate(88 118)" filter="url(#shadow)">
    <rect width="704" height="342" rx="22" fill="white"/>
    <line x1="96" y1="268" x2="628" y2="268" stroke="#263244" stroke-width="2.5"/>
    <line x1="96" y1="268" x2="96" y2="52" stroke="#263244" stroke-width="2.5"/>
    <path d="M628 268L608 257V279L628 268Z" fill="#263244"/>
    <path d="M96 52L85 72H107L96 52Z" fill="#263244"/>

    <line x1="96" y1="160" x2="612" y2="160" stroke="#D9E0E8" stroke-width="1.5" stroke-dasharray="6 7"/>
    <line x1="362" y1="268" x2="362" y2="66" stroke="#D9E0E8" stroke-width="1.5" stroke-dasharray="6 7"/>

    <text x="362" y="318" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#263244">Cross-lingual stability</text>
    <text x="362" y="341" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#6B7B90">lower EN-vs-ZH drift, higher top-1 match</text>

    <g transform="translate(35 164) rotate(-90)">
      <text text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#263244">Human alignment</text>
    </g>

    <text x="210" y="95" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#B56225">Human-like but unstable</text>
    <text x="514" y="95" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#5C4BA0">Ideal region</text>
    <text x="210" y="235" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#8A96A6">Weak on both</text>
    <text x="514" y="235" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#24715C">Stable but less human-like</text>

    <circle cx="520" cy="126" r="10" fill="#7A62C7"/>
    <circle cx="548" cy="142" r="7" fill="#7A62C7" opacity="0.72"/>
    <circle cx="488" cy="110" r="7" fill="#7A62C7" opacity="0.62"/>

    <circle cx="505" cy="218" r="10" fill="#4E9B84"/>
    <text x="525" y="223" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#24715C">mimo-v2-pro</text>
    <circle cx="548" cy="207" r="7" fill="#4E9B84" opacity="0.7"/>
    <circle cx="468" cy="232" r="7" fill="#4E9B84" opacity="0.65"/>

    <circle cx="238" cy="120" r="10" fill="#E6864A"/>
    <text x="256" y="125" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#A75522">gemini-2.5-flash</text>
    <circle cx="206" cy="136" r="7" fill="#E6864A" opacity="0.65"/>

    <circle cx="250" cy="220" r="8" fill="#AEB8C5"/>
    <circle cx="214" cy="238" r="7" fill="#AEB8C5" opacity="0.7"/>
    <circle cx="294" cy="208" r="7" fill="#AEB8C5" opacity="0.65"/>
  </g>

  <g transform="translate(836 118)" filter="url(#shadow)">
    <rect width="356" height="342" rx="22" fill="white"/>
    <text x="34" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">Reading the result</text>
    <line x1="34" y1="70" x2="322" y2="70" stroke="#E0E6EE"/>

    <circle cx="48" cy="106" r="7" fill="#4E9B84"/>
    <text x="68" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#39485C">Most stable does not mean most human-like.</text>

    <circle cx="48" cy="156" r="7" fill="#E6864A"/>
    <text x="68" y="162" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#39485C">Most human-like can still shift under Chinese prompts.</text>

    <circle cx="48" cy="206" r="7" fill="#7A62C7"/>
    <text x="68" y="212" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#39485C">The ideal region is useful, but no model dominates both axes.</text>

    <rect x="34" y="252" width="288" height="56" rx="14" fill="#F7F9FC" stroke="#DCE4EE"/>
    <text x="178" y="276" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#172033">Conclusion</text>
    <text x="178" y="298" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#5D6F85">Use role-specific model selection, not one leaderboard.</text>
  </g>
</svg>
