    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#8DA0B8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
