<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CoordBench README hero</title>
  <desc id="desc">Bilingual prompts flowing through an LLM into human-alignment and cross-lingual stability diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.48" stop-color="#EEF7F3"/>
      <stop offset="1" stop-color="#FFF7EF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4F7DCB"/>
      <stop offset="1" stop-color="#7EB6E8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3EA66B"/>
      <stop offset="1" stop-color="#8BD5A4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D77A45"/>
      <stop offset="1" stop-color="#F4BB77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#203049" flood-opacity="0.14"/>
